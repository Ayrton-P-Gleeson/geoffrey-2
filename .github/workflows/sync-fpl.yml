name: Sync FPL data

on:
  push:
    paths-ignore:
      - 'data/fpl.json'
  workflow_dispatch:
  schedule:
    # Run twice per hour. Avoid the top of the hour where GitHub Actions
    # scheduled jobs can be delayed by platform load.
    - cron: '7,37 * * * *'

permissions:
  contents: write

concurrency:
  group: sync-fpl
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Sync FPL
        run: python scripts/sync_fpl.py
      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fpl.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update FPL data snapshot'
          git push
